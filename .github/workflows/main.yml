name: 'Nuget Release'

on:
  push:
    tags:
    - '*'
    
jobs:
  build:

    env:
      BUILD_CONFIG: 'Release'
      SOLUTION: './NissanConnect/NissanConnect.sln'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore $SOLUTION

    - name: Build
      run: dotnet build $SOLUTION --configuration $BUILD_CONFIG -p:PackageVersion=${{github.ref_name}} --no-restore

    - name: Test
      run: dotnet test $SOLUTION --configuration $BUILD_CONFIG --no-build

    - name: Publish
      run: dotnet nuget push NissanConnect/NissanConnectLib/bin/Release/*.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key ${{secrets.NUGET_API_KEY}}
